<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SEISAMUSE{% endblock %} | Jun Xie</title>
  <meta name="description" content="{% block description %}Personal academic website of Jun Xie — Seismologist{% endblock %}">
  <link rel="alternate" type="application/atom+xml" title="Atom Feed" href="{{ root }}atom.xml">
  <link rel="stylesheet" href="{{ root }}css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Favicon (placeholder) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <!-- MathJax for LaTeX rendering -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="21a99622-5a23-45f4-be80-edef627a68e3"></script>
  <!-- Busuanzi for public visitor counter -->
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container masthead">
      <a class="masthead-identity" href="{{ root }}" aria-label="SEISAMUSE home">
        <img src="{{ root }}images/seisamuse.png" alt="" class="masthead-avatar">
        <span class="masthead-title">SEISAMUSE</span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="{{ root }}"{% if active == 'home' %} class="active"{% endif %}>Home</a>
        <a href="{{ root }}blog/"{% if active == 'blog' %} class="active"{% endif %}>Blog</a>
        <a href="{{ root }}thoughts/"{% if active == 'thoughts' %} class="active"{% endif %}>Thoughts</a>
        <a href="{{ root }}archives/"{% if active == 'archives' %} class="active"{% endif %}>Archives</a>
        <a href="{{ root }}about/"{% if active == 'about' %} class="active"{% endif %}>About</a>
        <a href="{{ root }}links/"{% if active == 'links' %} class="active"{% endif %}>Links</a>
      </nav>

      <div class="masthead-actions" aria-label="Site shortcuts">
        <form class="masthead-search" action="{{ root }}search/" method="get">
          <input type="search" name="q" placeholder="Search notes" aria-label="Search notes">
        </form>
        <a href="https://www.travellings.cn/go" target="_blank" rel="noopener" title="Travellings" aria-label="Travellings"><i class="fa-solid fa-train"></i></a>
        <a href="mailto:junxie01@gmail.com" title="Email" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        <a href="{{ root }}atom.xml" title="Atom feed" aria-label="Atom feed"><i class="fa-solid fa-rss"></i></a>
      </div>
    </div>
  </header>

  <main>
    <div class="container {% if layout is defined and layout == 'home' %}home-shell{% elif layout is defined and layout == 'blog' %}blog-grid{% elif layout is defined and layout == 'wide' %}page-wide{% elif post is defined and post.toc %}post-grid{% endif %}">
      {% block sidebar_left %}{% endblock %}
      {% block content %}{% endblock %}
      {% block sidebar_right %}{% endblock %}
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; {{ year }} Jun Xie &middot; Built with Python &amp; Markdown &middot;
        <a href="https://github.com/junxie01" target="_blank">GitHub</a> &middot;
        <a href="{{ root }}atom.xml" target="_blank">Atom</a>
      </p>
      <p class="site-stats">
        <span id="busuanzi_container_site_pv">
          👁 Total visits: <span id="busuanzi_value_site_pv"></span>
        </span>
        &middot;
        <span id="busuanzi_container_site_uv">
          Visitors: <span id="busuanzi_value_site_uv"></span>
        </span>
      </p>
    </div>
  </footer>

</body>
</html>
