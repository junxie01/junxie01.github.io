    <div class="container page-wide">
      
      
<h1 class="page-title">Search</h1>

<form class="search-form search-page-form" action="/search/" method="get">
  <input id="search-input" class="search-input" type="search" name="q" placeholder="Search title, tag, or content" autocomplete="off" autofocus>
  <button class="search-button" type="submit">Search</button>
</form>

<p id="search-status" class="search-status">Type one or more keywords to search the blog.</p>
<ul id="search-results" class="post-list search-results"></ul>

<noscript>
  <p class="search-status">Search needs JavaScript because this is a static site.</p>
</noscript>

<script>
(function () {
  var input = document.getElementById("search-input");
  var status = document.getElementById("search-status");
  var results = document.getElementById("search-results");
  var posts = [];

  function normalize(value) {
    return (value || "").toString().toLowerCase();
  }

  function termsFromQuery(query) {
    return normalize(query).trim().split(/\s+/).filter(Boolean);
  }

  function scorePost(post, terms) {
    var title = normalize(post.title);
    var tags = normalize((post.tags || []).join(" "));
    var excerpt = normalize(post.excerpt);
    var slug = normalize(post.slug);
    var content = normalize(post.content);
    var combined = [title, tags, excerpt, slug, content].join(" ");
    var compactCombined = combined.replace(/[\s\-_\/]+/g, "");
    var score = 0;

    for (var i = 0; i < terms.length; i += 1) {
      var term = terms[i];
      var compactTerm = term.replace(/[\s\-_\/]+/g, "");
      if (combined.indexOf(term) === -1 && compactCombined.indexOf(compactTerm) === -1) {
        return 0;
      }
      if (title.indexOf(term) !== -1) score += 12;
      if (tags.indexOf(term) !== -1) score += 8;
      if (excerpt.indexOf(term) !== -1) score += 4;
      if (slug.indexOf(term) !== -1 || slug.replace(/[\s\-_\/]+/g, "").indexOf(compactTerm) !== -1) score += 5;
      if (content.indexOf(term) !== -1) score += 1;
    }
    return score;
  }

  function makeSnippet(post, terms) {
    var text = post.excerpt || post.content || "";
    var lower = normalize(text);
    var firstHit = -1;

    for (var i = 0; i < terms.length; i += 1) {
      var hit = lower.indexOf(terms[i]);
      if (hit !== -1 && (firstHit === -1 || hit < firstHit)) {
        firstHit = hit;
      }
    }

    if (firstHit === -1) {
      return text.slice(0, 180);
    }

    var start = Math.max(0, firstHit - 70);
    var end = Math.min(text.length, firstHit + 150);
    return (start > 0 ? "..." : "") + text.slice(start, end) + (end < text.length ? "..." : "");
  }

  function clearResults() {
    while (results.firstChild) {
      results.removeChild(results.firstChild);
    }
  }

  function render(query) {
    var terms = termsFromQuery(query);
    clearResults();

    if (!terms.length) {
      status.textContent = "Type one or more keywords to search the blog.";
      return;
    }

    var matches = posts
      .map(function (post) {
        return { post: post, score: scorePost(post, terms) };
      })
      .filter(function (item) {
        return item.score > 0;
      })
      .sort(function (a, b) {
        return b.score - a.score || b.post.date.localeCompare(a.post.date);
      })
      .slice(0, 30);

    status.textContent = matches.length
      ? "Found " + matches.length + " result" + (matches.length === 1 ? "." : "s.")
      : "No matching posts.";

    matches.forEach(function (item) {
      var post = item.post;
      var li = document.createElement("li");
      li.className = "post-item";

      var date = document.createElement("span");
      date.className = "post-date";
      date.textContent = post.date;
      li.appendChild(date);

      var heading = document.createElement("h3");
      var link = document.createElement("a");
      link.href = post.url;
      link.textContent = post.title;
      heading.appendChild(link);
      li.appendChild(heading);

      var excerpt = document.createElement("p");
      excerpt.className = "excerpt";
      excerpt.textContent = makeSnippet(post, terms);
      li.appendChild(excerpt);

      if (post.tags && post.tags.length) {
        var tagWrap = document.createElement("div");
        tagWrap.className = "post-tags";
        post.tags.forEach(function (tag) {
          var tagLink = document.createElement("a");
          tagLink.href = "/blog/tag/" + normalize(tag).replace(/\s+/g, "-").replace(/\//g, "-") + "/";
          tagLink.textContent = tag;
          tagWrap.appendChild(tagLink);
        });
        li.appendChild(tagWrap);
      }

      results.appendChild(li);
    });
  }

  function setQueryParam(query) {
    var url = new URL(window.location.href);
    if (query.trim()) {
      url.searchParams.set("q", query.trim());
    } else {
      url.searchParams.delete("q");
    }
    window.history.replaceState({}, "", url);
  }

  fetch("/search.json")
    .then(function (response) {
      return response.json();
    })
    .then(function (data) {
      posts = data;
      var params = new URLSearchParams(window.location.search);
      var initialQuery = params.get("q") || "";
      input.value = initialQuery;
      render(initialQuery);
    })
    .catch(function () {
      status.textContent = "Search index could not be loaded.";
    });

  input.addEventListener("input", function () {
    render(input.value);
    setQueryParam(input.value);
  });
}());
</script>
